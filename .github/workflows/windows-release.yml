name: Build and publish Windows release

on:
  push:
    branches:
      - arena/93c7e9f4-brbacoding
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build MSI and NSIS installers
        shell: pwsh
        run: |
          npm run tauri build 2>&1 | Tee-Object -FilePath tauri-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            Select-String -Path tauri-build.log -Pattern '(?i)error|failed|not found|could not|exception' | Select-Object -Last 30 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          }
          exit $buildExit
      - name: Publish this update as a GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: Br Ba Coding Agent · build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
